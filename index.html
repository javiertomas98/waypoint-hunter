<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>4x4 Waypoint Hunter</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { --orange: #ff4400; --dark: #121212; --panel: #1e1e1e; }
        
        * { box-sizing: border-box; }

        body { 
            background: var(--dark); 
            color: white; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; /* Altura total de la ventana */
            width: 100vw;
            overflow: hidden; 
        }

        /* El mapa ocupa el espacio sobrante */
        #map { 
            flex: 1; 
            width: 100%; 
        }

        #status { 
            font-size: 11px; 
            color: #888; 
            text-align: center; 
            padding: 5px;
            background: var(--dark);
        }

        /* Panel inferior fijo */
        .bottom-ui {
            background: var(--panel);
            border-top: 2px solid var(--orange);
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .stats-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 10px; 
        }

        .box { 
            background: #2a2a2a; 
            padding: 8px; 
            border-radius: 8px; 
            text-align: center; 
        }

        .box b { font-size: 1.5em; color: var(--orange); display: block; }
        .box span { font-size: 0.7em; color: #aaa; text-transform: uppercase; }

        button { 
            width: 100%; 
            padding: 15px; 
            background: var(--orange); 
            color: white; 
            border: none; 
            border-radius: 10px; 
            font-size: 1em; 
            font-weight: bold; 
            cursor: pointer;
            touch-action: manipulation;
        }

        button:active { background: #cc3700; }
        button:disabled { background: #444; color: #888; }

        /* Estilo para el marcador del usuario */
        .user-dot {
            background: #0077ff;
            border: 2px solid white;
            border-radius: 50%;
        }
    </style>
</head>

        <div class="stats-grid">
            <div class="box"><span>Distancia</span><b id="dist">---</b> m</div>
            <div class="box"><span>Rumbo</span><b id="bear">---</b> °</div>
        </div>
        <button id="btn" onclick="getWaypoint()">GENERAR RETO 4x4</button>
    </div>
